[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analytics"
version = "0.2.0"
description = "Анализ и прогнозирование продаж сети металлобаз"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Д.В. Логинов" }]
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
# Тесты: pip install -e ".[dev]"
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sales_analytics.storage" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
